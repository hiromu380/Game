name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify SIM_VERSION change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node .github/scripts/check-sim-version.mjs "$BASE_SHA" "$HEAD_SHA"
          fi
      - run: pnpm build
      - run: pnpm --filter @chain-factory/client build:demo
      - run: pnpm --filter @chain-factory/desktop build:demo
