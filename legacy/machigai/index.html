function genScene(seed,k='h'){if(!KINDS[k])k='h';const r=rng(seed),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),pc=()=>ri(0,PAL.length-1);
 const O=[],add=(t,x,y,e={})=>{O.push({t,x,y,s:1,c:pc(),v:0,f:0,h:0,...e});return O[O.length-1]};
 const bg=KINDS[k].gen(r,ri,pc,add);return{k,seed,bg,O}}


// 間違い：op は c=色 h=消す s=大きさ f=反転 v=形 m=ずらす
const OPN={c:'色を変える',h:'消す',s:'大きさを変える',f:'左右反転',v:'形を変える',m:'少しずらす'};
const OPW={h:1,c:2,s:2,m:3,f:3,v:4};// 気づかれにくさ（高いほど難しい）
function applyEdits(O,edits){return O.map((o,i)=>{const e=edits.get(i);if(!e)return o;const q={...o};
 if(e.op==='c')q.c=e.p;else if(e.op==='h')q.h=1;else if(e.op==='s')q.s=e.p?1.22:.8;else if(e.op==='f')q.f=o.f?0:1;else if(e.op==='v')q.v=e.p;
 else if(e.op==='m'){q.x+=[10,-10,0,0][e.p];q.y+=[0,0,-8,8][e.p]}return q})}
function firstParam(o,op){if(op==='c')return(o.c+1)%pal(o).length;if(op==='v')return(o.v+1)%T[o.t].vc;if(op==='s')return 1;return 0}
function cycleParam(o,e){if(e.op==='c'){let p=(e.p+1)%pal(o).length;if(p===o.c)p=(p+1)%pal(o).length;return p}
 if(e.op==='v'){let p=(e.p+1)%T[o.t].vc;if(p===o.v)p=(p+1)%T[o.t].vc;return p}if(e.op==='s')return e.p^1;if(e.op==='m')return(e.p+1)%4;return e.p}

// ---------- 拡大・移動（ボタン、ホイール、ピンチ、ドラッグ）。複数のキャンバスで同じ視点を共有できる ----------
const newView=()=>({z:1,x:0,y:0});
let CURV=null;
function clampView(V){V.z=Math.max(1,Math.min(5,V.z));V.x=Math.max(0,Math.min(SW-SW/V.z,V.x));V.y=Math.max(0,Math.min(SH-SH/V.z,V.y))}
function updZoomUI(){if(!CURV)return;document.querySelectorAll('.zl').forEach(e=>e.textContent='×'+CURV.z.toFixed(1));
 document.querySelectorAll('canvas.scene').forEach(cv=>cv.style.touchAction=CURV.z>1?'none':'pan-y')}
function attachView(cvs,V,redraw,onTap){CURV=V;let raf=0;
 V.req=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;redraw();updZoomUI()})};
 V.zoomAt=(sx,sy,nz)=>{const px=V.x+sx/V.z,py=V.y+sy/V.z;V.z=Math.max(1,Math.min(5,nz));V.x=px-sx/V.z;V.y=py-sy/V.z;clampView(V);V.req()};
 for(const cv of cvs){const pts=new Map();let st=null,moved=false,pin=null;
  const loc=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*SW,(e.clientY-r.top)/r.height*SH]};
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,loc(e));
   if(pts.size===1){st={p:loc(e),x:V.x,y:V.y};moved=false;pin=null}
   else if(pts.size===2){const[a,b]=[...pts.values()];pin={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z:V.z};moved=true}});
  cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,loc(e));
   if(pts.size>=2&&pin){const[a,b]=[...pts.values()];V.zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pin.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pin.d);return}
   if(st){const p=loc(e),dx=p[0]-st.p[0],dy=p[1]-st.p[1];if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved&&V.z>1){V.x=st.x-dx/V.z;V.y=st.y-dy/V.z;clampView(V);V.req()}}});
  const end=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);pts.delete(e.pointerId);
   if(e.type==='pointerup'&&!moved&&st&&!pts.size)onTap(V.x+p[0]/V.z,V.y+p[1]/V.z);if(!pts.size){st=null;pin=null}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',e=>{e.preventDefault();const[sx,sy]=loc(e);V.zoomAt(sx,sy,V.z*(e.deltaY<0?1.25:.8))},{passive:false})}
 updZoomUI()}

// 形式：舞台.部屋の番号(36進)-「物の番号+操作+値」…  例 p.k2x9a-5c3-12h0（舞台なしの古い形式は部屋）
function encode(sc,edits){return[sc.k+'.'+sc.seed.toString(36),...[...edits].map(([i,e])=>i+e.op+e.p.toString(36))].join('-')}
function decode(code){const parts=String(code).trim().toLowerCase().split('-');let k='h',s=parts[0];if(s.includes('.'))[k,s]=s.split('.');
 const seed=parseInt(s,36);if(!Number.isFinite(seed)||!KINDS[k])return null;const sc=genScene(seed,k),edits=new Map();
 for(const q of parts.slice(1)){const m=/^(\d+)([chsfvm])([0-9a-z])$/.exec(q);if(!m)continue;const i=+m[1],o=sc.O[i];if(!o||!T[o.t].ops.includes(m[2]))continue;
  let p=parseInt(m[3],36);if(m[2]==='c')p%=pal(o).length;else if(m[2]==='v')p%=T[o.t].vc;else if(m[2]==='s')p&=1;else if(m[2]==='m')p%=4;edits.set(i,{op:m[2],p})}
 return edits.size?{sc,edits}:null}
function makeAuto(seed,k,n){const sc=genScene(seed,k),r=rng(seed^0x9e3779b9),edits=new Map();
 const cand=sc.O.map((o,i)=>i).filter(i=>T[sc.O[i].t].ops);
 while(edits.size<n&&cand.length){const i=cand.splice(Math.floor(r()*cand.length),1)[0],o=sc.O[i],ops=T[o.t].ops,op=ops[Math.floor(r()*ops.length)];
  const e={op,p:firstParam(o,op)};if(op==='c'||op==='v'){const k2=Math.floor(r()*3);for(let j=0;j<k2;j++)e.p=cycleParam(o,e)}if(op==='m')e.p=Math.floor(r()*4);edits.set(i,e)}
 return{sc,edits}}

function parseResult(h){const r=hashParam(h,'r');if(!r)return null;const[pid,t,miss,found,n]=r.split('.');if(!pid||!(+n))return null;
 return{pid,t:+t||0,miss:+miss||0,found:+found||0,n:+n,w:(hashParam(h,'w')||'').slice(0,16),raw:r+'|'+(hashParam(h,'w')||'')}}

 <section class="card"><div class="row" style="justify-content:space-between"><h2>わたしの出題</h2><button class="sm" data-go="mine">成績を見る</button></div>
  <p class="small muted">${M.length?`${M.length}問を出題中。届いた結果は合計${M.reduce((a,m)=>a+m.plays.length,0)}件です。`:'出題すると、友達から届いた結果（タイム）がここにたまっていきます。'}</p></section>
 <section class="card"><h2>遊び方</h2><ol class="steps">
  <li><div><b>仕掛ける</b><p class="small muted">部屋・レストラン・公園・海の中から舞台を選び、物をタップして色・形・大きさを変えたり、消したり、少しずらしたり。3〜7個まで。</p></div></li>
  <li><div><b>送る</b><p class="small muted">できあがったリンクを友達に送ります。問題はリンクの中に入っています。</p></div></li>
  <li><div><b>見つけてもらう</b><p class="small muted">友達は左右の絵を見比べてタップ（拡大もできます）。見当違いの場所は5秒のペナルティ。</p></div></li>
  <li><div><b>結果が届く</b><p class="small muted">友達が送り返した「記録用リンク」を開くと、あなたの成績に記録されます。</p></div></li></ol></section>`;
 const pv=$('#pv');sizeCanvas(pv);const k=KORDER[Math.floor(Math.random()*KORDER.length)],sc=genScene(rndSeed(),k);drawScene(pv,sc,sc.O);
 $('#pvc').textContent=`${KINDS[k].n}の絵の例。舞台は部屋・レストラン・公園・海の中の4つ。毎回ちがう絵が自動でできあがります。`}
function dailyCard(){const k=dayKey(),rec=loadDaily()[k],s=streak();
 return`<section class="card"><div class="daily"><div class="stack" style="gap:8px"><h2>今日の1問 <span class="small muted">${dayLabel(k)}・${KINDS[dailyKind(k)].n}・まちがい6個</span></h2>
  <p class="small">${rec?(rec.gave?`${rec.n}個中${rec.found}個でギブアップ`:`記録 <b>${fmt(rec.t)}</b>　ミス${rec.miss}`):'まだ挑戦していません。毎日0時に全員共通の新しい問題になります。'}　${s?`🔥 ${s}日連続`:''}</p>${weekStrip()}</div>
  <div class="row">${rec?`<button class="pri" data-go="dshare">結果をコピー</button><button data-go="daily">もう一度解く</button>`:`<button class="pri" data-go="daily">挑戦する</button>`}</div></div></section>`}

// ---------- 仕掛ける ----------
let E=null,EV=newView();
function startEdit(k){k=k||(E&&E.sc.k)||'h';E={sc:genScene(rndSeed(),k),edits:new Map(),max:(E&&E.max)||5,sel:null,peek:false};EV=newView();vEdit()}
function diffStars(){if(!E.edits.size)return 0;let s=0;for(const[i,e]of E.edits){const b=wbox(E.sc.O[i]);s+=OPW[e.op]+((b[2]-b[0])*(b[3]-b[1])<1400?1:0)}return Math.max(1,Math.min(5,Math.round(s/E.edits.size)))}
function vEdit(){stopTimer();const n=E.edits.size,st=diffStars(),o=E.sel!=null?E.sc.O[E.sel]:null,e=E.sel!=null?E.edits.get(E.sel):null;
 app.innerHTML=`<section class="edit"><div class="stack">
  <div class="kinds" role="group" aria-label="舞台">${KORDER.map(k=>`<button class="sm${E.sc.k===k?' on':''}" data-kind="${k}">${KINDS[k].n}</button>`).join('')}<button class="sm" data-go="reroll">別の絵にする</button></div>
  <canvas class="scene" id="ec" aria-label="仕掛ける絵。物をタップして選ぶ"></canvas>${ZOOMBAR}
  <div class="row"><button class="sm" id="peek">押している間、元の絵を見る</button></div></div>
  <div class="stack"><div class="card"><div class="stat"><span>仕掛けた数<b>${n}<small style="font-size:16px"> / ${E.max}</small></b></span><span>むずかしさ（目安）<b class="meter">${'★'.repeat(st)}<i>${'★'.repeat(5-st)}</i></b></span></div>
   <div class="row"><span class="small muted">上限</span>${[3,5,7].map(k=>`<button class="sm${E.max===k?' on':''}" data-max="${k}">${k}個</button>`).join('')}</div></div>
  <div class="card">${o?`<h2>${T[o.t].n}</h2>${T[o.t].ops?`<div class="ops">${[...T[o.t].ops].map(op=>`<button class="${e&&e.op===op?'on':''}" data-op="${op}">${OPN[op]}</button>`).join('')}</div>
   <p class="small muted">${e?'同じボタンをもう一度押すと、変え方が変わります。':'どう変えるか選んでください。'}</p>${e?'<button class="sm" data-op="undo">この物を元に戻す</button>':''}`:'<p class="small muted">この物は変えられません。</p>'}`
   :`<p><b>絵の中の物をタップ</b>して選んでください。</p><p class="small muted">小さい物を、気づきにくい変え方（形・反転・ずらす）で変えるほど難しくなります。細かい物は拡大すると選びやすくなります。</p>`}</div>
  ${n?`<div class="card"><h2>仕掛けたまちがい</h2><ul class="list">${[...E.edits].map(([i,x],k)=>`<li><span class="badge">${k+1}</span>${T[E.sc.O[i].t].n}を${OPN[x.op]}</li>`).join('')}</ul></div>`:''}
  <button class="pri" data-go="publish" ${n<3?'disabled':''}>${n<3?`あと${3-n}個仕掛けると出題できます`:'この問題を出題する'}</button></div></section>`;
 const cv=$('#ec');sizeCanvas(cv);drawEdit();
 attachView([cv],EV,drawEdit,(x,y)=>{const O=applyEdits(E.sc.O,E.edits);let hit=null;
  for(let i=O.length-1;i>=0;i--){if(inBox(wbox(O[i].h?E.sc.O[i]:O[i]),x,y,2)){hit=i;break}}E.sel=hit;sfx('tap');vEdit()});
 const pk=$('#peek'),on=v=>{E.peek=v;drawEdit()};pk.addEventListener('pointerdown',()=>on(true));['pointerup','pointerleave','pointercancel'].forEach(t=>pk.addEventListener(t,()=>on(false)))}
function drawEdit(){const cv=$('#ec');if(!cv)return;const O=E.peek?E.sc.O:applyEdits(E.sc.O,E.edits);drawScene(cv,E.sc,O,EV);if(E.peek)return;
 const c=cv.getContext('2d');let k=0;for(const[i]of E.edits){k++;const b=wbox(O[i].h?E.sc.O[i]:O[i]);dot(c,b[0],b[1],7,'#D93025');c.fillStyle='#fff';c.font='bold 9px sans-serif';c.textAlign='center';c.fillText(k,b[0],b[1]+3)}
 if(E.sel!=null){const b=wbox(O[E.sel].h?E.sc.O[E.sel]:O[E.sel]);c.setLineDash([4,3]);c.strokeStyle='#1A1A1A';c.lineWidth=1.5;c.strokeRect(b[0]-3,b[1]-3,b[2]-b[0]+6,b[3]-b[1]+6);c.setLineDash([])}}
function doOp(op){const i=E.sel,o=E.sc.O[i];if(op==='undo'){E.edits.delete(i);vEdit();return}
 const e=E.edits.get(i);
 if(e&&e.op===op){if(op==='h'||op==='f')E.edits.delete(i);else e.p=cycleParam(o,e)}
 else{if(!e&&E.edits.size>=E.max){toast(`まちがいは${E.max}個までです`);return}E.edits.set(i,{op,p:firstParam(o,op)})}
 sfx('tap');vEdit()}

// ---------- 出題 ----------
function vPublish(){stopTimer();CURV=null;const code=encode(E.sc,E.edits);registerMine(code,'',E.edits.size,E.sc.k);
 app.innerHTML=`<section class="card"><h2>出題の準備ができました</h2>
  <p class="small muted">名前を入れると「〇〇さんからの挑戦状」と表示されます（なくてもかまいません）。</p>
  <div class="row"><input type="text" id="nm" maxlength="16" placeholder="あなたの名前（任意）" aria-label="名前"></div>
  <p class="link" id="lk"></p>
  <div class="row"><button class="pri" id="cp">リンクをコピー</button><button data-go="test">自分で解いてみる</button><button data-go="back">仕掛けにもどる</button><button data-go="mine">わたしの出題を見る</button></div>
  <p class="small muted">舞台：${KINDS[E.sc.k].n}　問題コード：<b>${code}</b><br>解いた人が「記録用リンク」を送り返してくれたら、このページで開いてください。「わたしの出題」に成績がたまります（この端末のブラウザに保存）。</p></section>`;
 const upd=()=>{$('#lk').textContent=shareLink(code,$('#nm').value.trim())};upd();$('#nm').addEventListener('input',upd);
 $('#cp').addEventListener('click',()=>{registerMine(code,$('#nm').value.trim(),E.edits.size,E.sc.k);copy($('#lk').textContent)})}

// ---------- 解く ----------
let P=null,SV=newView();
function startSolve(pz,opt={}){const O2=applyEdits(pz.sc.O,pz.edits);
 const diffs=[...pz.edits.keys()].map(i=>{const a=wbox(pz.sc.O[i]),b=O2[i].h?a:wbox(O2[i]);let bx=[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[2],b[2]),Math.max(a[3],b[3])];
  const cx=(bx[0]+bx[2])/2,cy=(bx[1]+bx[3])/2;bx=[Math.min(bx[0],cx-12),Math.min(bx[1],cy-12),Math.max(bx[2],cx+12),Math.max(bx[3],cy+12)];return{i,b:bx}});
 P={pz,O2,diffs,found:new Set(),miss:0,marks:[],t0:performance.now(),end:null,gave:false,name:opt.name||'',from:opt.from||'auto',dkey:opt.dkey||null,code:encode(pz.sc,pz.edits),w:''};
 SV=newView();vSolve()}
const elapsed=()=>((P.end??performance.now())-P.t0)/1000;
const total=()=>elapsed()+P.miss*5;
function solveTitle(){if(P.from==='daily')return`今日の1問 <span class="small muted">${dayLabel(P.dkey)}・${KINDS[P.pz.sc.k].n}</span>`;
 if(P.name)return esc(P.name)+'さんからの挑戦状';return P.from==='auto'?`おまかせ問題 <span class="small muted">${KINDS[P.pz.sc.k].n}</span>`:'間違い探し'}
function vSolve(){const n=P.diffs.length,done=P.end!=null;
 app.innerHTML=`<section class="stack"><div class="row" style="justify-content:space-between">
   <h2>${solveTitle()}</h2>
   <div class="stat"><span>見つけた<b>${P.found.size}<small style="font-size:16px"> / ${n}</small></b></span><span>タイム<b id="tm">${fmt(total())}</b></span><span>ミス<b>${P.miss}</b></span></div></div>
  <div class="dots" aria-hidden="true">${P.diffs.map((d,k)=>`<i class="${P.found.has(k)?'f':''}"></i>`).join('')}</div>
  ${ZOOMBAR}
  <div class="pair"><figure class="fig"><canvas class="scene" id="sa" aria-label="もとの絵"></canvas><figcaption>もとの絵</figcaption></figure>
   <figure class="fig"><canvas class="scene" id="sb" aria-label="まちがいのある絵"></canvas><figcaption>まちがいのある絵（どちらをタップしてもOK。拡大は両方の絵に同時にかかります）</figcaption></figure></div>
  ${done?resultCard():`<div class="row"><p class="small muted" style="flex:1">ちがう所をタップ。見当違いの場所をタップすると、タイムに5秒加算されます。</p><button class="sm" data-go="giveup">あきらめて答えを見る</button></div>`}</section>`;
 const A=$('#sa'),B=$('#sb');sizeCanvas(A);sizeCanvas(B);drawSolve();
 attachView([A,B],SV,drawSolve,(x,y)=>tapSolve(x,y));
 stopTimer();if(!done)TIMER=setInterval(()=>{const t=$('#tm');if(t)t.textContent=fmt(total())},250);
 const wn=$('#wn');if(wn){wn.value=P.w;const upd=()=>{P.w=wn.value.trim();$('#rt').textContent=sendBackText()};upd();wn.addEventListener('input',upd)}}
function drawSolve(){const A=$('#sa'),B=$('#sb');if(!A)return;drawScene(A,P.pz.sc,P.pz.sc.O,SV);drawScene(B,P.pz.sc,P.O2,SV);const now=performance.now();
 for(const cv of[A,B]){const c=cv.getContext('2d');P.diffs.forEach((d,k)=>{if(P.found.has(k))penCircle(c,d.b,'#D93025');else if(P.gave)penCircle(c,d.b,'#2E86AB')});
  for(const m of P.marks)if(now-m.t<700){c.globalAlpha=1-(now-m.t)/700;const s=8/SV.z;c.strokeStyle='#D93025';c.lineWidth=3.5/SV.z;c.lineCap='round';c.beginPath();c.moveTo(m.x-s,m.y-s);c.lineTo(m.x+s,m.y+s);c.moveTo(m.x+s,m.y-s);c.lineTo(m.x-s,m.y+s);c.stroke();c.globalAlpha=1}}
 if(P.marks.some(m=>now-m.t<700))requestAnimationFrame(drawSolve)}
function tapSolve(x,y){if(P.end!=null)return;let best=-1,area=1e9;
 P.diffs.forEach((d,k)=>{if(P.found.has(k)||!inBox(d.b,x,y,4))return;const a=(d.b[2]-d.b[0])*(d.b[3]-d.b[1]);if(a<area){area=a;best=k}});
 if(best>=0){P.found.add(best);sfx('ok');if(P.found.size===P.diffs.length){P.end=performance.now();finished();setTimeout(()=>sfx('done'),200)}vSolve()}
 else{P.miss++;P.marks.push({x,y,t:performance.now()});sfx('ng');const m=$('#tm');if(m)m.textContent=fmt(total());drawSolve();
  const ms=document.querySelectorAll('.stat b')[2];if(ms)ms.textContent=P.miss}}
function finished(){if(P.from!=='daily')return;const D=loadDaily();
 if(!D[P.dkey]){D[P.dkey]={t:Math.round(total()),miss:P.miss,found:P.found.size,n:P.diffs.length,gave:P.gave?1:0};LS.set('mc_daily',D);P.firstDaily=true}}
const sentBack=()=>P.from==='link'||P.from==='code';
function resultLink(){return`${baseURL()}#r=${pidOf(P.code)}.${Math.round(total())}.${P.miss}.${P.found.size}.${P.diffs.length}${P.w?'&w='+encodeURIComponent(P.w):''}`}
function sendBackText(){const n=P.diffs.length,head=`【まちがい仕掛け人】${P.name?P.name+'さんの':''}間違い探し（${n}個）`;
 return`${head}${P.gave?`、${n}個中${P.found.size}個でギブアップ…`:`を ${fmt(total())} で全部見つけた！${P.miss?`（ミス${P.miss}回）`:'（ノーミス）'}`}\n記録用リンク：${resultLink()}`}
function resultCard(){const n=P.diffs.length;let body='';
 if(P.from==='daily'){const rec=loadDaily()[P.dkey];
  body=`<p class="small muted">${P.firstDaily?'今日の記録として保存しました。':'今日の記録は最初の1回だけです。'}</p><p class="link" id="rt">${esc(dailyShareText(P.dkey))}</p>
   <div class="row"><button class="pri" data-copy="rt">結果をコピーしてシェア</button><button data-go="edit">自分も仕掛ける</button><button data-go="home">ホームへ</button></div>`}
 else if(sentBack()){body=`<p class="small muted">出題者に結果を送り返しましょう。出題者がこの「記録用リンク」を開くと、成績に記録されます。</p>
   <div class="row"><input type="text" id="wn" maxlength="16" placeholder="あなたの名前（任意）" aria-label="あなたの名前"></div><p class="link" id="rt"></p>
   <div class="row"><button class="pri" data-copy="rt">結果をコピーして送り返す</button><button data-go="edit">自分も仕掛ける</button></div>`}
 else body=`<div class="row"><button class="pri" data-go="auto">おまかせ問題をもう1問</button><button data-go="edit">自分も仕掛ける</button></div>`;
 const head=P.gave?`<h2>答え合わせ</h2><p>青い丸が見つけられなかった所です（${n}個中${P.found.size}個 発見）。</p>`
  :`<h2>全部見つけた！　${fmt(total())}</h2><p class="small muted">見つけるまで ${fmt(elapsed())}、ミス ${P.miss}回（+${P.miss*5}秒）</p>`;
 return`<div class="card done">${head}${body}</div>`}

// ---------- わたしの出題 ----------
function vMine(focus){stopTimer();CURV=null;const M=loadMine().slice().reverse();
 app.innerHTML=`<section class="stack"><h2>わたしの出題</h2>
  <p class="small muted">友達から届いた「記録用リンク」をこのページで開くと、ここに記録されます。記録はこの端末のブラウザに保存されます。</p>
  <div class="row"><input type="text" id="code" placeholder="記録用リンクを貼る" aria-label="記録用リンク"><button data-go="code">記録する</button></div>
  ${M.length?M.map(m=>mineCard(m,m.pid===focus)).join(''):'<div class="card"><p>まだ出題していません。</p><div class="row"><button class="pri" data-go="edit">まちがいを仕掛ける</button></div></div>'}</section>`}
function mineCard(m,hl){const ps=m.plays||[],ok=ps.filter(p=>p.found>=p.n),avg=ok.length?ok.reduce((a,p)=>a+p.t,0)/ok.length:null,best=ok.length?Math.min(...ok.map(p=>p.t)):null;
 return`<div class="card${hl?' done':''}"><div class="row" style="justify-content:space-between"><b>${KINDS[m.k]?KINDS[m.k].n:'部屋'}・まちがい${m.n}個</b><span class="small muted">${new Date(m.at).toLocaleDateString('ja-JP')} 出題</span></div>
  <div class="stat"><span>届いた結果<b>${ps.length}</b></span><span>平均タイム<b>${avg!=null?fmt(avg):'-'}</b></span><span>最速<b>${best!=null?fmt(best):'-'}</b></span><span>ギブアップ<b>${ps.length-ok.length}</b></span></div>
  ${ps.length?`<div class="tw"><table class="tb"><tr><th>名前</th><th>タイム</th><th>ミス</th><th>発見</th></tr>${ps.slice().sort((a,b)=>(b.found/b.n-a.found/a.n)||a.t-b.t).map(p=>`<tr><td>${esc(p.w||'名前なし')}</td><td>${fmt(p.t)}</td><td>${p.miss}</td><td>${p.found}/${p.n}</td></tr>`).join('')}</table></div>`:'<p class="small muted">まだ結果は届いていません。</p>'}
  <div class="row"><button class="sm" data-mlink="${m.pid}">出題リンクをコピー</button><button class="sm" data-mtry="${m.pid}">自分で解いてみる</button></div></div>`}

// ---------- 画面の切り替え ----------
function openCode(v){v=String(v||'').trim();if(!v)return;
 const res=parseResult(v);if(res){if(recordResult(res)){toast(`${res.w||'名前なし'}さんの結果を記録しました`);vMine(res.pid)}else toast('この記録用リンクは、出題した人の端末で開くと記録されます');return}
 const q=hashParam(v,'q')||v,pz=decode(q);if(!pz){toast('問題コードが読み取れません。リンクをそのまま貼ってください');return}
 startSolve(pz,{name:(hashParam(v,'n')||'').slice(0,16),from:'code'})}
function go(k){switch(k){
 case'home':clearHash();vHome();break;
 case'edit':startEdit();break;
 case'reroll':startEdit(E.sc.k);break;
 case'publish':vPublish();break;
 case'back':vEdit();break;
 case'test':startSolve({sc:E.sc,edits:new Map(E.edits)},{from:'test'});break;
 case'auto':startSolve(makeAuto(rndSeed(),KORDER[Math.floor(Math.random()*KORDER.length)],5),{from:'auto'});break;
 case'daily':{const dk=dayKey();startSolve(dailyPuzzle(dk),{from:'daily',dkey:dk});break}
 case'dshare':copy(dailyShareText(dayKey()));return;
 case'mine':clearHash();vMine();break;
 case'code':openCode($('#code')&&$('#code').value);break;
 case'giveup':P.gave=true;P.end=performance.now();finished();vSolve();break}
 window.scrollTo&&window.scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target;
 const g=t.closest('[data-go]');if(g){go(g.dataset.go);return}
 const op=t.closest('[data-op]');if(op){doOp(op.dataset.op);return}
 const kd=t.closest('[data-kind]');if(kd){startEdit(kd.dataset.kind);return}
 const mx=t.closest('[data-max]');if(mx){const k=+mx.dataset.max;if(E.edits.size>k){toast(`もう${E.edits.size}個仕掛けています`);return}E.max=k;vEdit();return}
 const zb=t.closest('[data-z]');if(zb&&CURV){const V=CURV;if(zb.dataset.z==='fit'){V.z=1;V.x=0;V.y=0;clampView(V);V.req()}else V.zoomAt(SW/2,SH/2,V.z*(zb.dataset.z==='in'?1.5:1/1.5));return}
 const cp=t.closest('[data-copy]');if(cp){const el=document.getElementById(cp.dataset.copy);if(el)copy(el.textContent);return}
 const ml=t.closest('[data-mlink]');if(ml){const m=loadMine().find(x=>x.pid===ml.dataset.mlink);if(m)copy(shareLink(m.code,m.name));return}
 const mt=t.closest('[data-mtry]');if(mt){const m=loadMine().find(x=>x.pid===mt.dataset.mtry),pz=m&&decode(m.code);if(pz)startSolve(pz,{from:'test'});return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')go('code')});

function boot(){const h=location.hash;
 const res=parseResult(h);if(res){clearHash();if(recordResult(res)){toast(`${res.w||'名前なし'}さんの結果を記録しました`);vMine(res.pid)}
  else{vHome();toast('この記録用リンクは、出題した人の端末で開くと記録されます')}return}
 const q=hashParam(h,'q');if(q){const pz=decode(q);if(pz){startSolve(pz,{name:(hashParam(h,'n')||'').slice(0,16),from:'link'});return}toast('リンクの問題が読み取れませんでした')}
 vHome()}
addEventListener('hashchange',boot);
boot();
</script>
